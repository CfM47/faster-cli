[package]
name = "faster-cli"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal internet speed test measuring latency, download and upload directly"
repository = "https://github.com/CfM47/faster-cli"
license = "MIT"
readme = "README.md"
keywords = ["cli", "speed-test", "network", "bandwidth", "internet"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "fast"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
